# Replace example domains and certificate paths with the hosting configuration.
server {
    listen 80;
    server_name site.example api.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name site.example;
    ssl_certificate /etc/letsencrypt/live/site.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name api.example;
    ssl_certificate /etc/letsencrypt/live/api.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
